<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Карточка «Выдохи в воду»</title>
    <style>
      *{box-sizing:border-box} body{margin:0;background:#edf4f4;font-family:system-ui,sans-serif;color:#292a36}
      main{min-height:100vh;display:grid;place-items:center;padding:24px}.sheet{text-align:center}.sheet img{display:block;width:min(90vw,900px);height:auto;border-radius:24px;box-shadow:0 20px 50px #1b303030}.sheet p{margin:18px 0 0}.sheet button{margin-top:12px;border:0;border-radius:14px;padding:13px 22px;background:#108f98;color:white;font-weight:700}
      @media print{@page{size:A4 landscape;margin:12mm}body,main{background:white}.sheet img{width:100%;box-shadow:none;border-radius:0}.sheet p,.sheet button{display:none}}
    </style>
  </head>
  <body><main><div class="sheet"><img src="./assets/breathing-card.png" alt="Карточка Выдохи в воду" /><p>Печатайте в альбомной ориентации и масштабе 100%.</p><button onclick="window.print()">Печать</button></div></main></body>
</html>
